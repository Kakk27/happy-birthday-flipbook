<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="claude:viewport-fit-sides" content="cover">
  <title>Happy Birthday Li Engg!!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Poppins:ital,wght@0,400;0,500;0,600;1,600&family=Noto+Sans+Khmer:wght@400;600&family=Noto+Serif+Khmer:wght@400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <div class="app" id="app">
    <header class="top">
      <div class="brand">Enjoy my gift<i class="star"></i></div>
      <div class="top-actions">
        <button class="sound on" id="sound" type="button" aria-label="Turn music off" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></button>
      </div>
    </header>
    <main class="stage" id="stage">
      <div class="book" id="book"></div>
    </main>
    <button class="rb side" id="prev" type="button" aria-label="Previous page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" />
      </svg>
    </button>
    <button class="rb side" id="next" type="button" aria-label="Next page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M9 5l7 7-7 7" />
      </svg>
    </button>
    <nav class="nav" aria-label="Pages">
      <div class="dots" id="dots"></div>
    </nav>
  </div>

  <div class="gate" id="gate" hidden role="alertdialog" aria-labelledby="gate-t" aria-describedby="gate-d">
    <div class="gate-dots" aria-hidden="true"></div>
    <svg class="gate-phone" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="19" y="6" width="26" height="52" rx="5" />
      <path d="M28 51h8" />
    </svg>
    <h2 id="gate-t">Rotate your phone</h2>
    <p id="gate-d">Please turn your phone sideways to open the flipbook.</p>
  </div>

  <script src="js/index.js"></script>
</body>

</html>
